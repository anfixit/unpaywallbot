name: unpaywallbot

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      # Кеш статей не ограничен по числу записей, поэтому
      # предел задаётся здесь, а не только через TTL.
      - --maxmemory
      - "96mb"
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  bot:
    image: ${BOT_IMAGE:-ghcr.io/anfixit/unpaywallbot:latest}
    build:
      context: .
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - bot_logs:/app/data/logs
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      # tmpfs занимает RAM по мере заполнения; размеры
      # рассчитаны на хост с 1 ГБ памяти.
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/appuser/.cache:rw,nosuid,nodev,size=64m
      - /home/appuser/.config:rw,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 384m
    cpus: 1.0
    # Большой /dev/shm нужен только Chromium, а headless-режим
    # по умолчанию выключен. Поднимите до 512m, если включаете его
    # (и только на хосте, где хватает RAM).
    shm_size: 64m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "bot.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  backend:
    internal: true
  egress:

volumes:
  bot_logs:
  redis_data:
