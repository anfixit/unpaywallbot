[project]
name = 'unpaywallbot'
version = '0.1.0'
description = 'Telegram bot for responsible analysis of public article content'
readme = 'README.md'
requires-python = '>=3.12'
license = {file = 'LICENSE'}
authors = [
    {name = 'Anfisa Kovganyuk'},
]
dependencies = [
    'aiogram>=3.0',
    'beautifulsoup4>=4.14.3',
    'cryptography>=50.0.0',
    'httpx>=0.28.1',
    'lxml>=6.1.0',
    'lxml-html-clean>=0.4.5',
    'playwright>=1.58.0',
    'pydantic-settings>=2.14.2',
    'pyyaml>=6.0.3',
    'readability-lxml>=0.8.4.1',
    'redis>=5.0',
    'telegraph[aio]>=2.2.0',
]

[dependency-groups]
dev = [
    'mypy>=1.10',
    'pre-commit>=3.0',
    'pytest>=9.0.2',
    'pytest-asyncio>=1.3.0',
    'pytest-cov>=7.0.0',
    'ruff>=0.4',
    'types-PyYAML>=6.0.12.20250516',
]

[tool.ruff]
line-length = 79
target-version = 'py312'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'N', 'UP', 'S', 'B']

[tool.ruff.lint.isort]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ['S101', 'S105', 'S106']

[tool.mypy]
python_version = '3.12'
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ['tests']
asyncio_mode = 'auto'
addopts = [
    '--cov=bot',
    '--cov-report=term-missing',
    '--cov-fail-under=60',
]
