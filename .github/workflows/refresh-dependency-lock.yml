name: Refresh dependency lock

on:
  push:
    branches:
      - chore/dependency-manifest-cleanup

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/dependency-manifest-cleanup

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install 'uv==0.11.32'

      - name: Refresh and validate lock
        run: |
          set -Eeuo pipefail
          uv lock
          uv sync --locked
          git diff --check

      - name: Commit lock file
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore(deps): refresh dependency lock'
          git push origin HEAD:chore/dependency-manifest-cleanup
