name: Build and deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  UV_VERSION: "0.11.32"

jobs:
  publish:
    name: Publish image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Check out validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "$GHCR_TOKEN" |
          docker login ghcr.io
          --username "${GITHUB_ACTOR}"
          --password-stdin

      - name: Build image
        run: |
          set -Eeuo pipefail
          docker build \
            --build-arg UV_VERSION="${UV_VERSION}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "${IMAGE_NAME}:${SOURCE_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Push immutable and latest tags
        run: |
          docker push "${IMAGE_NAME}:${SOURCE_SHA}"
          docker push "${IMAGE_NAME}:latest"

      - name: Export image reference
        id: image
        run: echo "ref=${IMAGE_NAME}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
      PUBLIC_ACCESS: ${{ secrets.PUBLIC_ACCESS }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      IMAGE_REF: ${{ needs.publish.outputs.image }}
    steps:
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Create production environment file
        run: |
          set -Eeuo pipefail
          umask 077
          {
            printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
            printf 'ENCRYPTION_KEY=%s\n' "$ENCRYPTION_KEY"
            printf 'REDIS_URL=redis://redis:6379/0\n'
            printf 'ALLOWED_USERS=%s\n' "$ALLOWED_USERS"
            printf 'PUBLIC_ACCESS=%s\n' "${PUBLIC_ACCESS:-false}"
            printf 'LOG_LEVEL=INFO\n'
            printf 'ENV=production\n'
            printf 'REQUEST_TIMEOUT_SECONDS=90\n'
            printf 'TELEGRAPH_ENABLED=false\n'
          } > "$RUNNER_TEMP/.env.production"

      - name: Upload environment file
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -P "$port" \
            -o BatchMode=yes \
            "$RUNNER_TEMP/.env.production" \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/.env.production.next"

      - name: Authenticate server to GHCR
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"

      - name: Activate release
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            bash -s -- "$DEPLOY_PATH" "$IMAGE_REF" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          image_ref="$2"

          cd "$deploy_path"
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main

          mv .env.production.next .env.production
          chmod 600 .env.production

          BOT_IMAGE="$image_ref" docker compose pull bot
          BOT_IMAGE="$image_ref" docker compose up -d --remove-orphans
          BOT_IMAGE="$image_ref" docker compose ps
          BOT_IMAGE="$image_ref" \
            docker compose exec -T bot python -m bot.healthcheck
          REMOTE
