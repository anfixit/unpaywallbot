name: Build and deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  UV_VERSION: "0.11.32"

jobs:
  publish:
    name: Publish image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Check out validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: >-
          printf '%s' "$GHCR_TOKEN" |
          docker login ghcr.io
          --username "${GITHUB_ACTOR}"
          --password-stdin

      - name: Build image
        run: |
          set -Eeuo pipefail
          docker build \
            --build-arg UV_VERSION="${UV_VERSION}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "${IMAGE_NAME}:${SOURCE_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Push immutable and latest tags
        run: |
          set -Eeuo pipefail
          docker push "${IMAGE_NAME}:${SOURCE_SHA}"
          docker push "${IMAGE_NAME}:latest"

      - name: Export image reference
        id: image
        run: echo "ref=${IMAGE_NAME}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    needs: publish
    # Серверный деплой выключен, пока repository variable
    # DEPLOY_ENABLED не установлена в 'true'.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
      PUBLIC_ACCESS: ${{ secrets.PUBLIC_ACCESS }}
      TELEGRAPH_ENABLED: ${{ secrets.TELEGRAPH_ENABLED }}
      ARCHIVE_PROXY_VLESS: ${{ secrets.ARCHIVE_PROXY_VLESS }}
      GHCR_TOKEN: ${{ github.token }}
      GHCR_USERNAME: ${{ github.actor }}
      IMAGE_REF: ${{ needs.publish.outputs.image }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git
    steps:
      - name: Validate deployment inputs
        run: |
          set -Eeuo pipefail
          required=(
            SSH_HOST
            SSH_USER
            SSH_PRIVATE_KEY
            DEPLOY_PATH
            BOT_TOKEN
            ENCRYPTION_KEY
            ALLOWED_USERS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required deployment value is missing: ${name}" >&2
              exit 1
            fi
          done

          # ALLOWED_USERS='[]' — непустая строка, но пустой список.
          # Бот с такой конфигурацией откажется стартовать, поэтому
          # проверяем то же условие, что и приложение.
          if [[ "${PUBLIC_ACCESS:-false}" != 'true' ]]; then
            allowlist="${ALLOWED_USERS//[[:space:]]/}"
            if [[ "$allowlist" == '[]' ]]; then
              echo 'ALLOWED_USERS is an empty list and PUBLIC_ACCESS is not true.' >&2
              echo 'Production would refuse to start. Set one of them.' >&2
              exit 1
            fi
          fi

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            echo 'SSH_KNOWN_HOSTS is not set; bootstrapping the host key.'
            ssh-keyscan -p "$port" -H "$SSH_HOST" \
              > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts"

      - name: Verify SSH access
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" \
            'set -eu; printf "remote-user="; id -un; id'

      - name: Verify Git availability
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'set -eu; command -v git; git --version'

      - name: Verify Docker access
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            bash <<'REMOTE'
          set -Eeuo pipefail
          command -v docker

          if docker info >/dev/null 2>&1; then
            docker_cmd=(docker)
            echo 'docker-access=direct'
          elif sudo -n docker info >/dev/null 2>&1; then
            docker_cmd=(sudo -n docker)
            echo 'docker-access=passwordless-sudo'
          else
            echo 'Docker exists but the deployment user cannot access the daemon.' >&2
            id >&2
            ls -l /var/run/docker.sock >&2 || true
            getent group docker >&2 || true
            docker info >&2 || true
            sudo -n docker info >&2 || true
            exit 1
          fi

          if "${docker_cmd[@]}" compose version >/dev/null 2>&1; then
            "${docker_cmd[@]}" compose version
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose version
          else
            echo 'Docker Compose is not installed.' >&2
            exit 1
          fi
          REMOTE

      - name: Prepare deployment repository
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            bash -s -- "$DEPLOY_PATH" "$REPOSITORY_URL" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          repository_url="$2"

          if [[ ! -d "$deploy_path/.git" ]]; then
            mkdir -p "$deploy_path"
            git clone \
              --branch main \
              --single-branch \
              "$repository_url" \
              "$deploy_path"
          fi

          test -d "$deploy_path/.git"
          test -w "$deploy_path"
          printf 'deploy-path=%s\n' "$deploy_path"
          REMOTE

      - name: Create production environment file
        run: |
          set -Eeuo pipefail
          umask 077
          {
            printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
            printf 'ENCRYPTION_KEY=%s\n' "$ENCRYPTION_KEY"
            printf 'REDIS_URL=redis://redis:6379/0\n'
            printf 'ALLOWED_USERS=%s\n' "$ALLOWED_USERS"
            printf 'PUBLIC_ACCESS=%s\n' "${PUBLIC_ACCESS:-false}"
            printf 'LOG_LEVEL=INFO\n'
            printf 'ENV=production\n'
            printf 'REQUEST_TIMEOUT_SECONDS=90\n'
            printf 'TELEGRAPH_ENABLED=%s\n' \
              "${TELEGRAPH_ENABLED:-false}"
            if [[ -n "${ARCHIVE_PROXY_VLESS:-}" ]]; then
              printf 'ARCHIVE_PROXY_URL=http://archive-proxy:1080\n'
            fi
          } > "$RUNNER_TEMP/.env.production"

      - name: Build archive proxy configuration
        if: ${{ env.ARCHIVE_PROXY_VLESS != '' }}
        run: |
          set -Eeuo pipefail
          umask 077
          python3 - "$RUNNER_TEMP/archive-proxy.json" <<'PY'
          import json, os, sys, urllib.parse

          link = os.environ['ARCHIVE_PROXY_VLESS'].strip()
          u = urllib.parse.urlparse(link)
          q = urllib.parse.parse_qs(u.query)
          get = lambda key, default='': q.get(key, [default])[0]

          if u.scheme != 'vless' or not u.hostname or not u.username:
              sys.exit('ARCHIVE_PROXY_VLESS is not a vless:// link')

          config = {
              'log': {'loglevel': 'warning'},
              'inbounds': [{
                  'port': 1080,
                  'listen': '0.0.0.0',
                  'protocol': 'http',
              }],
              'outbounds': [{
                  'protocol': 'vless',
                  'settings': {'vnext': [{
                      'address': u.hostname,
                      'port': u.port or 443,
                      'users': [{
                          'id': u.username,
                          'encryption': 'none',
                          'flow': get('flow'),
                      }],
                  }]},
                  'streamSettings': {
                      'network': get('type', 'tcp'),
                      'security': get('security', 'reality'),
                      'realitySettings': {
                          'serverName': get('sni', u.hostname),
                          'fingerprint': get('fp', 'chrome'),
                          'publicKey': get('pbk'),
                          'shortId': get('sid'),
                          'spiderX': '',
                      },
                  },
              }],
          }
          # Половина узлов подписки использует xhttp:
          # без его параметров соединение не встанет.
          stream = config['outbounds'][0]['streamSettings']
          if stream['network'] == 'xhttp':
              xhttp = {'path': get('path', '/'), 'mode': get('mode', 'auto')}
              extra = get('extra')
              if extra:
                  try:
                      xhttp['extra'] = json.loads(extra)
                  except ValueError:
                      pass
              stream['xhttpSettings'] = xhttp

          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump(config, handle)
          PY

      - name: Upload archive proxy configuration
        if: ${{ env.ARCHIVE_PROXY_VLESS != '' }}
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -P "$port" \
            -o BatchMode=yes \
            "$RUNNER_TEMP/archive-proxy.json" \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/archive-proxy.json"

      - name: Upload environment file
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -P "$port" \
            -o BatchMode=yes \
            "$RUNNER_TEMP/.env.production" \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/.env.production.next"

      - name: Authenticate server to GHCR
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          remote_login="if docker info >/dev/null 2>&1; then docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin; elif sudo -n docker info >/dev/null 2>&1; then sudo -n docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin; else exit 1; fi"
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "$remote_login"

      - name: Activate release
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            bash -s -- "$DEPLOY_PATH" "$IMAGE_REF" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          image_ref="$2"

          if docker info >/dev/null 2>&1; then
            docker_cmd=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            docker_cmd=(sudo -n docker)
          else
            echo 'Docker daemon access was lost.' >&2
            exit 1
          fi

          if "${docker_cmd[@]}" compose version >/dev/null 2>&1; then
            compose_cmd=("${docker_cmd[@]}" compose)
          elif command -v docker-compose >/dev/null 2>&1; then
            compose_cmd=(docker-compose)
          else
            echo 'Docker Compose is not installed.' >&2
            exit 1
          fi

          cd "$deploy_path"
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main

          mv .env.production.next .env.production
          chmod 600 .env.production

          BOT_IMAGE="$image_ref" "${compose_cmd[@]}" pull bot
          profile_args=()
          if [[ -f archive-proxy.json ]]; then
            # Образ прокси работает не от root, поэтому файл
            # должен быть читаемым. Каталог сужаем, чтобы
            # учётные данные узла не разошлись по хосту.
            chmod 644 archive-proxy.json
            chmod 750 .
            profile_args=(--profile archive-proxy)
          fi

          BOT_IMAGE="$image_ref" \
            "${compose_cmd[@]}" "${profile_args[@]}" \
            up -d --remove-orphans

          healthy=false
          for _ in $(seq 1 18); do
            # </dev/null обязателен: без него exec читает stdin,
            # то есть остаток этого скрипта, и проверка вместе с
            # хвостом шага молча теряется.
            if BOT_IMAGE="$image_ref" \
              "${compose_cmd[@]}" exec -T bot \
              python -m bot.healthcheck </dev/null; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [[ "$healthy" != true ]]; then
            BOT_IMAGE="$image_ref" "${compose_cmd[@]}" ps
            BOT_IMAGE="$image_ref" \
              "${compose_cmd[@]}" logs --tail=200 bot redis
            exit 1
          fi

          BOT_IMAGE="$image_ref" "${compose_cmd[@]}" ps

          # Каждый релиз оставляет предыдущий образ без тега.
          # Без очистки они копятся и забивают диск.
          # Никогда не роняем успешный деплой из-за уборки.
          "${docker_cmd[@]}" image prune -f --filter 'until=168h' \
            || echo 'Очистка старых образов пропущена.'
          "${docker_cmd[@]}" system df || true

          "${docker_cmd[@]}" logout ghcr.io >/dev/null 2>&1 || true
          REMOTE

  notify:
    name: Deployment notification
    if: always()
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_NOTIFICATION_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFICATION_CHAT_ID }}
    steps:
      # Уведомление отправляется первым: комментарий в issue
      # не должен помешать обязательному сообщению в Telegram.
      - name: Send Telegram deployment result
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$TELEGRAM_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            msg='Repository secrets TELEGRAM_NOTIFICATION_TOKEN'
            msg="$msg and TELEGRAM_NOTIFICATION_CHAT_ID are"
            msg="$msg required for deployment notifications."
            echo "::error::${msg}"
            exit 1
          fi

          text=$(cat <<MESSAGE
          GitHub Actions: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Commit: ${SOURCE_SHA}
          Publish: ${{ needs.publish.result }}
          Deploy: ${{ needs.deploy.result }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MESSAGE
          )

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}"

      - name: Record deployment result in issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          body=$(cat <<MESSAGE
          ### Deployment run ${{ github.run_number }}

          - Commit: \`${SOURCE_SHA}\`
          - Publish: **${{ needs.publish.result }}**
          - Deploy: **${{ needs.deploy.result }}**
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MESSAGE
          )
          gh issue comment 17 \
            --repo "$GITHUB_REPOSITORY" \
            --body "$body"
