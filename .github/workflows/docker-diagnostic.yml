name: Docker diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build image and capture log
        id: build
        shell: bash
        run: |
          set +e
          docker build \
            --build-arg UV_VERSION=0.11.32 \
            --tag unpaywallbot:diagnostic \
            . > docker-build.log 2>&1
          status=$?
          cat docker-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-build-diagnostic
          path: docker-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce Docker build
        run: test "${{ steps.build.outputs.status }}" = '0'
