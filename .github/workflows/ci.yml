name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.11.32'

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        id: ruff
        run: |
          set +e
          uv run ruff check bot tests scripts > ruff-report.txt 2>&1
          status=$?
          cat ruff-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mypy
        id: mypy
        run: |
          set +e
          uv run mypy bot > mypy-report.txt 2>&1
          status=$?
          cat mypy-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Package audited source
        run: git archive --format=zip HEAD -o source-snapshot.zip

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-reports
          path: |
            ruff-report.txt
            mypy-report.txt
            source-snapshot.zip
          if-no-files-found: error
          retention-days: 7

      - name: Enforce quality gates
        run: |
          test "${{ steps.ruff.outputs.status }}" = '0'
          test "${{ steps.mypy.outputs.status }}" = '0'

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      BOT_TOKEN: '123456789:AABBCCDDEEFFaabbccddeeff-1234567890'
      ENCRYPTION_KEY: 'test-encryption-key-at-least-32-characters'
      REDIS_URL: 'redis://localhost:6379/0'
      ALLOWED_USERS: '[]'
      PUBLIC_ACCESS: 'true'
      ENV: 'testing'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run test suite
        run: uv run pytest --tb=short -q

  security:
    name: Dependency and code audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Export locked production dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project
          --format requirements-txt
          --output-file requirements-audit.txt

      - name: Audit dependencies
        id: audit
        run: |
          set +e
          uvx pip-audit -r requirements-audit.txt \
            > pip-audit-report.txt 2>&1
          status=$?
          cat pip-audit-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Static security scan
        id: bandit
        run: |
          set +e
          uvx bandit -r bot -q > bandit-report.txt 2>&1
          status=$?
          cat bandit-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: |
            pip-audit-report.txt
            bandit-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce security gates
        run: |
          test "${{ steps.audit.outputs.status }}" = '0'
          test "${{ steps.bandit.outputs.status }}" = '0'

  refresh-lock:
    name: Refresh dependency lock
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref == 'agent/production-readiness-audit'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Upgrade lock file
        run: uv lock --upgrade

      - name: Upload refreshed lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refreshed-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1

      - name: Commit refreshed lock
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore(deps): refresh secure lock file'
          git push origin "HEAD:${{ github.head_ref }}"

  docker:
    name: Docker build
    needs: [quality, test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build production image
        run: >-
          docker build
          --build-arg UV_VERSION=${UV_VERSION}
          --tag unpaywallbot:${{ github.sha }}
          .

  notify:
    name: Telegram notification
    if: always()
    needs: [quality, test, security, docker]
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_NOTIFICATION_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFICATION_CHAT_ID }}
    steps:
      - name: Send workflow result
        shell: bash
        run: |
          if [[ -z "$TELEGRAM_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo 'Telegram notification secrets are not available.'
            exit 0
          fi

          text=$(cat <<MESSAGE
          GitHub Actions: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Lint and types: ${{ needs.quality.result }}
          Tests: ${{ needs.test.result }}
          Security: ${{ needs.security.result }}
          Docker: ${{ needs.docker.result }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MESSAGE
          )

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}"
