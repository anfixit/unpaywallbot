name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.32"

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff
        run: uv run ruff check bot tests scripts

      - name: Mypy
        run: uv run mypy bot

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      BOT_TOKEN: "123456789:AABBCCDDEEFFaabbccddeeff-1234567890"
      ENCRYPTION_KEY: "test-encryption-key-at-least-32-characters"
      REDIS_URL: "redis://localhost:6379/0"
      ALLOWED_USERS: "[]"
      PUBLIC_ACCESS: "true"
      ENV: "testing"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run test suite
        run: uv run pytest --tb=short -q

  security:
    name: Dependency and code audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Export locked production dependencies
        run: >-
          uv export --locked --no-dev
          --format requirements-txt
          --output-file requirements-audit.txt

      - name: Audit dependencies
        run: uvx pip-audit -r requirements-audit.txt

      - name: Static security scan
        run: uvx bandit -r bot -q

  docker:
    name: Docker build
    needs: [quality, test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build production image
        run: >-
          docker build
          --build-arg UV_VERSION=${UV_VERSION}
          --tag unpaywallbot:${{ github.sha }}
          .
