name: Server Docker diagnostic

on:
  push:
    branches:
      - ops/server-docker-diagnostic

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$port" -H "$SSH_HOST" \
              > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect sanitized Docker diagnostics
        id: diagnostic
        run: |
          set -Eeuo pipefail
          port="${SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            bash <<'REMOTE' > "$RUNNER_TEMP/docker-diagnostic.txt" 2>&1
          set +e
          echo '== identity =='
          id
          echo
          echo '== docker client =='
          command -v docker || true
          docker --version 2>&1 || true
          echo
          echo '== daemon =='
          systemctl is-active docker 2>&1 || true
          systemctl is-enabled docker 2>&1 || true
          echo
          echo '== socket =='
          stat -c '%A %U %G %n' /var/run/docker.sock 2>&1 || true
          echo
          echo '== docker group =='
          getent group docker 2>&1 || true
          echo
          echo '== direct access =='
          docker info >/dev/null 2>docker-direct.err
          echo "exit=$?"
          tail -n 5 docker-direct.err 2>/dev/null || true
          rm -f docker-direct.err
          echo
          echo '== passwordless sudo =='
          sudo -n true >/dev/null 2>sudo.err
          echo "sudo-exit=$?"
          tail -n 5 sudo.err 2>/dev/null || true
          rm -f sudo.err
          sudo -n docker info >/dev/null 2>docker-sudo.err
          echo "sudo-docker-exit=$?"
          tail -n 5 docker-sudo.err 2>/dev/null || true
          rm -f docker-sudo.err
          echo
          echo '== compose =='
          docker compose version 2>&1 || true
          docker-compose version 2>&1 || true
          REMOTE

          sed -E \
            -e 's/[[:cntrl:]]//g' \
            -e 's/(token|password|secret)=[^[:space:]]+/\1=[REDACTED]/gi' \
            "$RUNNER_TEMP/docker-diagnostic.txt" \
            > "$RUNNER_TEMP/docker-diagnostic-clean.txt"

      - name: Record diagnostics
        run: |
          set -Eeuo pipefail
          {
            echo '### Server Docker diagnostic'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/docker-diagnostic-clean.txt"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment 17 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/comment.md"
