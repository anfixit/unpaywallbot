name: Bug report
description: Report a reproducible application or deployment bug
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities, credentials, private URLs, or subscriber-only article text here. Follow SECURITY.md for security reports.

  - type: input
    id: revision
    attributes:
      label: Commit SHA or version
      placeholder: abc1234
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Telegram handlers
        - URL validation or networking
        - Extraction or publication compatibility
        - Redis or rate limiting
        - Docker
        - GitHub Actions or deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use only public, lawful, non-sensitive test data.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, uv, Docker, Docker Compose, and Redis versions.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed tokens, passwords, cookies, private addresses, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I searched existing issues and pull requests.
          required: true
